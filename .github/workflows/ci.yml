# 影界 HDDE 持续集成：静态检查 + 前端测试与构建 + 后端核心回归
# 产品只在 Windows 上运行，CI 也用 Windows 运行器。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端 lint / 测试 / 构建
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # 仓库文件以 LF 存储，部分源码契约测试按 LF 匹配；Windows 运行器默认会转成 CRLF
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: 前端单元测试
        run: node --test "tests/image_compression_ui/*.mjs"
      - name: 构建
        run: npx vite build

  backend:
    name: 后端 lint / 核心回归
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Ruff
        run: |
          python -m pip install ruff==0.8.6
          python -m ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: 构建前端（打包资源契约测试需要 dist/index.html）
        run: |
          npm ci
          npx vite build
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 生成测试用设置文件（本机 settings/settings.json 不入库）
        shell: python
        run: |
          import json, os, pathlib, sys
          sys.path.insert(0, os.getcwd())
          import main
          settings = main.default_settings()
          settings["app_data_root"] = str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "hdde-ci-formal-root")
          pathlib.Path("settings").mkdir(exist_ok=True)
          pathlib.Path("settings/settings.json").write_text(json.dumps(settings, ensure_ascii=False, indent=2), encoding="utf-8")
      - name: 核心回归（依赖 main.py 的应用级测试）
        # 运行器默认 TEMP 是 8.3 短路径（RUNNER~1），与程序解析出的长路径比较会不相等
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >-
          python -m unittest
          tests.diagnostics.test_app_runtime_isolation
          tests.diagnostics.test_runtime_diagnostics
          tests.diagnostics.test_unified_feedback
          tests.test_packaged_runtime
          tests.test_task_record_deletion
          tests.output.test_lineage_feedback
          tests.local_retouch.test_batch_local_retouch
          tests.image_compression_ui.test_batch_output_contract
