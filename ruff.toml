# 影界 HDDE Python 静态检查（CI 与本地共用）
# 只开启“几乎必然是 Bug”的规则：语法错误、未定义名称、重复字典键、同名函数被覆盖。
# 风格类规则暂不开启，避免一次性改动大量受保护文件。
target-version = "py311"
extend-exclude = [
    "node_modules",
    "dist",
    "build",
    "tmp",
    "artifacts",
    "output",
    "external_tools",
    "tests/outputs",
    "tests/results",
    ".codex",
    ".claude",
    ".agents",
]

[lint]
select = ["E9", "F63", "F7", "F82", "F601", "F811"]
